apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-ingress
  namespace: ai-task-platform
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ai-backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-frontend
            port:
              number: 8080