apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend
  namespace: ai-task-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
    spec:
      containers:
      - name: ai-backend
        image: sidharth0307/ai-backend:7e79fc015d093b92a409691b117de6586c920a51
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: ai-configmap
        - secretRef:
            name: ai-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5