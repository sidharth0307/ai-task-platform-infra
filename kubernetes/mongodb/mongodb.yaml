apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-mongodb
  namespace: ai-task-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-mongodb
  template:
    metadata:
      labels:
        app: ai-mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6.0
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: ai-mongodb
  namespace: ai-task-platform
spec:
  selector:
    app: ai-mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017